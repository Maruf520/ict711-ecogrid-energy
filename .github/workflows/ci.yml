# Runs on every push + PR. If any fitness function fails the build goes red
# and it can't be merged into main (needs branch protection switched on for main).
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . -r requirements-dev.txt
      - name: "FF-03 Maintainable: lint and complexity <= 10 (ruff)"
        run: ruff check .
      - name: "Tests + fitness functions FF-01, 02, 05-08 + FF-04 coverage >= 85%"
        run: pytest -v -s --cov=ecogrid --cov-fail-under=85
      - name: "FF-09 Secure: code scan (bandit)"
        run: bandit -r src -ll
      - name: "FF-09 Secure: vulnerable packages (pip-audit)"
        run: pip-audit -r requirements-dev.txt
